<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary Brains Leaderboard</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/byte.css">
  <link rel="stylesheet" href="css/display.css">
</head>
<body class="display">
  <canvas id="rain" aria-hidden="true"></canvas>

  <header class="top">
    <img class="logo" src="assets/logo.jpg" alt="Binary Brains logo">
    <div class="titles">
      <h1 class="brand-title">B<span class="one">1</span>nary Bra<span class="one">1</span>ns</h1>
      <p class="sub pixel"><span class="live"><i></i>LIVE</span>Booth Challenge</p>
    </div>
    <div class="hud pixel">
      <div class="hud-item"><span class="hud-label">Total points</span><span class="hud-value" id="total">0000</span></div>
      <div class="hud-item"><span class="hud-label">Goal</span><span class="hud-value" id="goal">50</span></div>
      <span class="hud-sound icon-svg" id="sound-icon" title="Sound (M to mute)"></span>
    </div>
  </header>

  <main class="board">
    <section class="lanes" id="lanes" aria-live="polite"></section>
    <aside class="side">
      <div class="byte-card px-border">
        <div class="bubble px-border pixel" id="bubble"></div>
        <div class="byte-holder" id="byte"></div>
      </div>
      <div class="feed px-border">
        <h2 class="pixel"><span class="icon-svg" id="feed-icon"></span>Last points</h2>
        <ul id="feed"></ul>
      </div>
    </aside>
  </main>

  <div class="banner" id="banner" aria-hidden="true">
    <div class="banner-band">
      <span class="banner-kicker pixel"></span>
      <span class="banner-name pixel"></span>
    </div>
  </div>

  <button class="coin px-border pixel" id="coin" type="button">
    <span class="icon-svg" id="coin-icon"></span>Click or press any key to turn on sound
  </button>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/byte.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
