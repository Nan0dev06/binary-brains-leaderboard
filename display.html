<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary Brains Leaderboard</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/display.css">
</head>
<body class="display">
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="top">
    <img class="logo" src="assets/logo.jpg" alt="Binary Brains logo">
    <div class="titles">
      <h1 class="brand-title">B<span class="one">1</span>NARY BRA<span class="one">1</span>NS</h1>
      <p class="sub mono"><span class="live-dot"></span>LIVE &middot; BOOTH CHALLENGE<span class="cursor">_</span></p>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="label mono">TOTAL POINTS</span>
        <span class="value" id="total">0</span>
      </div>
      <div class="stat">
        <span class="label mono">GOAL</span>
        <span class="value" id="goal">50</span>
      </div>
      <span class="sound-ind icon-svg" id="sound-icon" title="Sound (M to mute)"></span>
    </div>
  </header>

  <main class="board">
    <section class="lanes" id="lanes" aria-live="polite"></section>
    <aside class="side">
      <div class="byte-wrap">
        <div class="bubble" id="bubble"></div>
        <div class="byte-holder"><byte-mascot id="byte" state="idle"></byte-mascot></div>
      </div>
      <div class="feed">
        <h2 class="mono">&gt; RECENT</h2>
        <ul id="feed"></ul>
      </div>
    </aside>
  </main>

  <div class="banner" id="banner" aria-hidden="true">
    <div class="banner-band"><span class="banner-kicker mono"></span><span class="banner-text"></span></div>
  </div>

  <button class="coin mono" id="coin" type="button">
    <span class="icon-svg" id="coin-icon"></span><span>Click or press any key to turn on sound<span class="cursor">_</span></span>
  </button>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="byte/byte-mascot.js"></script>
  <script src="js/byte-link.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
