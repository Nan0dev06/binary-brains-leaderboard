<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byte Preview</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/byte.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; gap: 24px; padding: 32px 16px; }
    .stage { width: min(420px, 80vw); }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .buttons button { padding: 10px 18px; }
    .stages-row { display: flex; gap: 32px; align-items: end; flex-wrap: wrap; justify-content: center; }
    .stages-row .small { width: 120px; }
    .stages-row .tiny { width: 48px; }
  </style>
</head>
<body>
  <h1 class="brand-title">BYTE <span class="muted">· mascot preview</span></h1>
  <div class="stage" id="byte"></div>
  <div class="buttons">
    <button class="btn" data-act="bop">Bop</button>
    <button class="btn" data-act="cheer">Cheer</button>
    <button class="btn" data-act="cheer-red">Cheer (red team)</button>
    <button class="btn" data-act="glitch">Glitch</button>
  </div>
  <div class="stages-row">
    <div class="small" id="byte-small"></div>
    <div class="tiny" id="byte-tiny"></div>
  </div>

  <script src="js/byte.js"></script>
  <script>
    const byte = Byte.mount(document.getElementById('byte'));
    Byte.mount(document.getElementById('byte-small'));
    Byte.mount(document.getElementById('byte-tiny'));
    document.querySelector('.buttons').addEventListener('click', e => {
      const act = e.target.dataset.act;
      if (act === 'bop') byte.bop();
      if (act === 'cheer') byte.cheer('#36d8ff');
      if (act === 'cheer-red') byte.cheer('#ff3b55');
      if (act === 'glitch') byte.glitch();
    });
  </script>
</body>
</html>
